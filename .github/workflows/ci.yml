name: ci

on:
  push:
  pull_request:

jobs:
  # Build + test on the POSIX targets the HAL supports today.
  # Windows is intentionally absent: the HAL (hal_posix.c / exec_oop_posix.c) is
  # POSIX-only for M1; a Win32 HAL + out-of-process executor is a later increment.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Verify the single-file amalgamation compiles and runs (drop-in path).
  amalgamation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate amalgamation
        run: sh tools/amalgamate.sh amalgamation
      - name: Compile + run single-file build
        run: |
          cc -std=c99 -D_GNU_SOURCE -Wall -Wextra -I amalgamation \
             amalgamation/gptps.c tests/test_engine.c -lpthread -ldl -o test_amalg
          ./test_amalg

  # Windows build + test on a real runner (Win32 HAL: src/hal_win.c) via mingw-w64
  # gcc (native PE binaries, __atomic support, full <windows.h>). POSIX-only tests
  # (fork/pthread executors + add-ons) are gated out in CMake.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Single-file amalgamation build
        run: |
          sh tools/amalgamate.sh
          cc -std=gnu99 -I amalgamation amalgamation/gptps.c examples/demo.c -o demo_amalg.exe
          ./demo_amalg.exe

  # Windows build + test with the native MSVC toolchain (cl.exe) via the default
  # Visual Studio (multi-config) generator. Complements the mingw-w64 gcc job: same
  # Win32 HAL (src/hal_win.c / exec_win.c), different compiler. POSIX-only tests are
  # gated out in CMake (if(UNIX)). C11 mode + CRT-deprecation defines come from
  # CMakeLists' if(MSVC) block, so no compiler flags are needed here.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  # AddressSanitizer + UBSan across the whole suite (memory errors, leaks, UB).
  # Uses CMake (not a hand-maintained source list) so it can't drift out of sync.
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -g"
      - name: Build
        run: cmake --build build-asan
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-asan --output-on-failure

  # ThreadSanitizer on the concurrent paths (ASLR disabled for TSan in CI).
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run under ThreadSanitizer
        run: |
          for t in test_engine test_failure test_scheduler test_settings test_step \
                   test_taskmgmt test_constraint test_deadletter test_cancel test_backpressure; do
            cc -fsanitize=thread -std=c99 -D_GNU_SOURCE -g -I include -I src \
               src/alloc.c src/hal_posix.c src/config.c src/config_toml.c src/settings.c src/engine.c src/exec_oop_posix.c \
               tests/$t.c -lpthread -ldl -o $t.tsan
            setarch "$(uname -m)" -R ./$t.tsan
          done

  # Optional platform-optimized HAL (adaptive mutexes, glibc): build with the opt-in
  # scale knob ON and run the whole suite, so the fast path stays correct on CI. The
  # default (knob OFF) is the portable pthread HAL exercised by every other job.
  hal_fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build + test with GPTPS_HAL_FAST=ON
        run: |
          cmake -S . -B build-fast -DGPTPS_HAL_FAST=ON
          cmake --build build-fast -j
          ctest --test-dir build-fast --output-on-failure

  # Exercise the two most fragile portability axes the native x86_64 + arm64
  # matrix never hits: WORD SIZE (i386, 32-bit, run natively) and BYTE ORDER
  # (s390x, 64-bit big-endian, run under QEMU). The journal/TOML/settings
  # serialization and every fixed-width type are validated here.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-bit (i386) build + full test
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cmake -S . -B build32 -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build build32 -j
          ctest --test-dir build32 --output-on-failure
      - name: big-endian (s390x) build + serialization tests under QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static
          cmake -S . -B build-s390x -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-s390x.cmake"
          cmake --build build-s390x -j
          # qemu-user needs the guest sysroot to find the s390x dynamic loader + libs
          # (without this every test dies on '/lib/ld64.so.1: No such file').
          export QEMU_LD_PREFIX=/usr/s390x-linux-gnu
          # Run the byte-order-critical, qemu-safe subset: serialization (toml /
          # journal-parser fuzz / settings) + core logic + the new features. Skip
          # fork/exec/dlopen/TTY tests (flaky under user-mode emulation; covered on
          # the native x86_64/arm64 runners).
          ctest --test-dir build-s390x --output-on-failure \
            -R 'constraint|cancel|backpressure|submit_ex|foundation|engine|failure|toml|scheduler|deadletter|settings|taskmgmt|step|alloc|result|orch|fuzz'

  # Prove the C99 core runs "on any hardware": compile under -ffreestanding
  # -fno-builtin against a stub HAL, link NO pthread/dl, and run a task in MANUAL
  # mode with a static memory pool (no libc heap). Backs the portability claim
  # that the HAL (gptps_hal.h) is the only platform seam.
  freestanding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build core with the stub HAL (-ffreestanding, no pthread/dl)
        run: sh freestanding/build.sh ./gptps_freestanding_demo
      - name: Run the MANUAL-mode demo (exit 0 = ran via the HAL seam only)
        run: ./gptps_freestanding_demo
      - name: Assert no pthread/dl linkage
        run: |
          if ldd ./gptps_freestanding_demo | grep -Eiq 'pthread|libdl'; then
            echo "ERROR: freestanding build pulled in pthread/dl"; exit 1
          fi
          echo "OK: no libpthread / libdl"
