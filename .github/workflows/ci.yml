name: ci

on:
  push:
  pull_request:
  # A dormant repo's green badge decays into fiction: toolchains, runner images and
  # dependencies move underneath a tree that has not been pushed to in months. The
  # weekly run keeps the badge a statement about TODAY.
  schedule:
    - cron: '0 6 * * 1'
  # Manual trigger. Added after the 2026-08-06 Actions outage, during which
  # push-triggered run CREATION was down for hours: commits landed on main and no
  # run was ever created for them, and GitHub does not create those retroactively.
  # Without this the only way to ask for a run was to push another commit - which
  # was the very thing not working. workflow_dispatch reaches the API by a
  # different path, and costs nothing when everything is healthy.
  workflow_dispatch:

# Two conventions every job below follows, both of which exist so a green run means
# what it says:
#
#   --no-tests=error  - `ctest` exits 0 when it finds NO tests. Since the suite moved
#     behind `if(GPTPS_BUILD_TESTS)` in CMakeLists, a typo in that guard (or anything
#     that stops the tests being registered) would configure clean, build clean, and
#     produce a green run that executed nothing. A test runner that reports success
#     for work it never ran is worse than no test runner. The flag makes "no tests"
#     the failure it always was. Note the count is platform-dependent - nine add_test
#     calls sit inside if(UNIX), so Windows registers 34 where POSIX registers 43 -
#     which is why this is a zero/non-zero gate and not a count floor.
#
#   timeout-minutes   - the default is SIX HOURS. Every test carries its own CTest
#     TIMEOUT, so the exposure is the unbounded non-test work: pacman -Syuu in the
#     msys2 setup, the two apt-get calls in `cross`, checkout, and the builds. The
#     values below sit at 8x or more over each job's worst observed green runtime.

jobs:
  # Build + test on the POSIX targets. Windows has its own jobs below (mingw-w64
  # and MSVC), both running the same suite against the Win32 HAL.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # Optimised build with warnings as errors. Every other job builds -O0, which
  # makes the whole FLOW-SENSITIVE diagnostic family (-Wformat-truncation,
  # -Wmaybe-uninitialized, -Wstringop-overflow) unreachable - they need the
  # optimiser's value ranges to fire. This leg is where those land, and -Werror is
  # what keeps them from accumulating as ignorable noise.
  werror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure (-O2, -Werror)
        run: cmake -S . -B build-werror -DCMAKE_BUILD_TYPE=Release
             -DCMAKE_C_FLAGS="-std=c99 -O2 -Wall -Wextra -Werror -Wno-unused-parameter"
      - name: Build
        run: cmake --build build-werror -j
      - name: Test
        run: ctest --test-dir build-werror --output-on-failure --no-tests=error

  # Does the PACKAGING work?
  #
  # Every other job builds INSIDE the tree, where every header is one -I away and
  # every target already exists. Not one of them can catch a missing install(), a
  # wrong INSTALL_INTERFACE include dir, a .pc with a prefix that only happens to be
  # right, a components block that approves anything, or an add-on library that was
  # never added to the export set. Those are the first things a stranger hits, and
  # until this job existed nothing here could fail on any of them.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Every add-on is built, amalgamated and documented
        run: sh tools/check_addon_coverage.sh

      - name: Configure, build, test, install to a staging prefix
        run: |
          cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pkg -j
          ctest --test-dir build-pkg --output-on-failure --no-tests=error
          cmake --install build-pkg --prefix "$PWD/stage"

      - name: The install tree contains what the docs promise
        run: |
          for f in include/gptps.h \
                   include/gptps/gptps_pool.h include/gptps/gptps_durable_queue.h \
                   lib/libgptps.a lib/libgptps_pool.a lib/libgptps_durable_queue.a \
                   lib/cmake/gptps/gptps-config.cmake \
                   bin/gptps_conformance \
                   lib/pkgconfig/gptps.pc lib/pkgconfig/gptps-pool.pc; do
            test -f "stage/$f" || { echo "ERROR: install is missing $f"; exit 1; }
          done
          # The core calls dlopen; a static pkg-config link without -ldl fails on
          # glibc < 2.34, and nothing in-tree would ever notice.
          grep -q -- '-ldl' stage/lib/pkgconfig/gptps.pc \
            || { echo "ERROR: gptps.pc omits -ldl, but the core calls dlopen"; exit 1; }
          # Relocatable: `cmake --install --prefix` is honoured at INSTALL time while
          # a baked-in prefix is fixed at CONFIGURE time. If those disagree every -I
          # points somewhere that does not exist.
          grep -q 'pcfiledir' stage/lib/pkgconfig/gptps.pc \
            || { echo "ERROR: gptps.pc is not relocatable"; exit 1; }

      - name: A stranger consumes a SUBSET via find_package COMPONENTS
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer -j
          ./build-consumer/consumer

      - name: ...and via pkg-config alone
        run: |
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig"
          cc -std=c99 tests/consumer/main.c \
             $(pkg-config --cflags --libs --static gptps-durable_queue gptps-pool) \
             -o pkgconsumer
          ./pkgconsumer

      - name: ...and via the amalgamation, with an add-on
        run: |
          sh tools/amalgamate.sh amalg --addons durable_queue,pool
          cc -std=c99 -D_GNU_SOURCE -Wall -Wextra -I amalg \
             amalg/gptps.c amalg/gptps_durable_queue.c tests/test_durable.c \
             -lpthread -ldl -o amalg_dq
          ./amalg_dq
          # gptps.c must be byte-identical whatever add-ons were asked for, or one
          # release has N hashes for one filename and SHA256SUMS means nothing.
          sh tools/amalgamate.sh amalg-none --addons none
          cmp amalg/gptps.c amalg-none/gptps.c \
            || { echo "ERROR: gptps.c depends on the add-on selection"; exit 1; }

      - name: A STRANGER builds a plug-in out-of-tree against the installed package
        # templates/plugin is a standalone project - nothing in this tree
        # add_subdirectory's it. Building it here is the only proof that the install
        # tree is usable by someone who did not clone the repo.
        run: |
          cmake -S templates/plugin -B build-plugin -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-plugin -j

      - name: The INSTALLED conformance harness accepts it...
        run: ./stage/bin/gptps_conformance build-plugin/myplugin.so

      - name: ...and rejects a plug-in that reads past its declared table size
        # A conformance harness that cannot fail certifies nothing. addon_greedy calls
        # a v1.4 routine while declaring a v1.0 floor - which works fine against a
        # current core and breaks only in an older host, i.e. exactly the mistake this
        # tool exists to catch before a user does.
        run: |
          if ./stage/bin/gptps_conformance build-pkg/addon_greedy.so; then
            echo "ERROR: conformance passed a plug-in that reads past its table"; exit 1
          fi
          if ./stage/bin/gptps_conformance build-pkg/addon_bad.so; then
            echo "ERROR: conformance passed a plug-in with the wrong magic"; exit 1
          fi

      - name: A typo in the add-on selector FAILS rather than selecting nothing
        run: |
          if sh tools/amalgamate.sh amalg-bad --addons pool,nosuch 2>/dev/null; then
            echo "ERROR: amalgamate.sh accepted an unknown add-on"; exit 1
          fi
          if cmake -S . -B build-bad -DGPTPS_ADDONS="pool;nosuch" >/dev/null 2>&1; then
            echo "ERROR: CMake accepted an unknown add-on"; exit 1
          fi

  # Verify the single-file amalgamation compiles and runs (drop-in path).
  amalgamation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate amalgamation
        run: sh tools/amalgamate.sh amalgamation
      - name: Assert the generated files carry the MIT notice
        # The amalgamation is the DISTRIBUTED form for anyone who vendors GPTPS,
        # and LICENSE requires its notice in "all copies or substantial portions".
        # Unfixable retroactively once someone has vendored a copy without it.
        run: |
          for f in amalgamation/gptps.h amalgamation/gptps.c; do
            grep -q 'Permission is hereby granted' "$f" \
              || { echo "ERROR: $f ships with no MIT notice"; exit 1; }
            grep -q 'SPDX-License-Identifier: MIT' "$f" \
              || { echo "ERROR: $f has no SPDX tag"; exit 1; }
          done
          echo "OK: both generated files carry the licence"
      - name: Compile + run single-file build
        run: |
          cc -std=c99 -D_GNU_SOURCE -Wall -Wextra -I amalgamation \
             amalgamation/gptps.c tests/test_engine.c -lpthread -ldl -o test_amalg
          ./test_amalg

  # Windows build + test on a real runner (Win32 HAL: src/hal_win.c) via mingw-w64
  # gcc (native PE binaries, __atomic support, full <windows.h>). POSIX-only tests
  # (fork/pthread executors + add-ons) are gated out in CMake.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Single-file amalgamation build
        run: |
          sh tools/amalgamate.sh
          cc -std=gnu99 -I amalgamation amalgamation/gptps.c examples/demo.c -o demo_amalg.exe
          ./demo_amalg.exe

  # Windows build + test with the native MSVC toolchain (cl.exe) via the default
  # Visual Studio (multi-config) generator. Complements the mingw-w64 gcc job: same
  # Win32 HAL (src/hal_win.c / exec_win.c), different compiler. POSIX-only tests are
  # gated out in CMake (if(UNIX)). C11 mode + CRT-deprecation defines come from
  # CMakeLists' if(MSVC) block, so no compiler flags are needed here.
  msvc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  # AddressSanitizer + UBSan across the whole suite (memory errors, leaks, UB).
  # Uses CMake (not a hand-maintained source list) so it can't drift out of sync.
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -g"
      - name: Build
        run: cmake --build build-asan
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --test-dir build-asan --output-on-failure --no-tests=error

  # ThreadSanitizer (ASLR disabled for TSan in CI).
  #
  # Driven by CMake and an EXCLUDE list, deliberately. This job used to hand-list
  # ten test binaries and six .c files, which meant every test and every add-on
  # added after it was written was silently NOT covered - including test_stress,
  # the one written specifically for TSan, and every add-on (durable_queue,
  # gptps_pool, gptps_xport, tui). A fail-closed allowlist in a race detector is
  # the worst place to have one: it reports success for work it never ran.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure + build under ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=thread -g"
          cmake --build build-tsan -j
      - name: Run the suite under ThreadSanitizer
        # Only bench_pool is excluded, and only for runtime (~25s under TSan for a
        # throughput benchmark that asserts nothing a race detector can use).
        run: setarch "$(uname -m)" -R ctest --test-dir build-tsan --output-on-failure --no-tests=error -E 'bench_pool'

  # Optional platform-optimized HAL (adaptive mutexes, glibc): build with the opt-in
  # scale knob ON and run the whole suite, so the fast path stays correct on CI. The
  # default (knob OFF) is the portable pthread HAL exercised by every other job.
  hal_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure + build + test with GPTPS_HAL_FAST=ON
        run: |
          cmake -S . -B build-fast -DGPTPS_HAL_FAST=ON
          cmake --build build-fast -j
          ctest --test-dir build-fast --output-on-failure --no-tests=error

  # Exercise the two most fragile portability axes the native x86_64 + arm64
  # matrix never hits: WORD SIZE (i386, 32-bit, run natively) and BYTE ORDER
  # (s390x, 64-bit big-endian, run under QEMU). The journal/TOML/settings
  # serialization and every fixed-width type are validated here.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 32-bit (i386) build + full test
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          cmake -S . -B build32 -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32
          cmake --build build32 -j
          ctest --test-dir build32 --output-on-failure --no-tests=error
      - name: big-endian (s390x) build + serialization tests under QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user-static
          cmake -S . -B build-s390x -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchain-s390x.cmake"
          cmake --build build-s390x -j
          # qemu-user needs the guest sysroot to find the s390x dynamic loader + libs
          # (without this every test dies on '/lib/ld64.so.1: No such file').
          export QEMU_LD_PREFIX=/usr/s390x-linux-gnu
          # EXCLUDE list, not an include list. The include list this replaced was
          # fail-closed: it silently skipped every test added after it was written,
          # including `abi` - the struct-layout regression gate, which is precisely
          # what a big-endian job exists to run - and it skipped it while its own
          # comment claimed serialization was covered.
          # What is excluded and why: fork/exec (the OOP + external-program
          # executors and anything driving them), dlopen (add-ons), and TTY work.
          # All three are flaky under qemu user-mode emulation rather than wrong,
          # and all three are covered on the native x86_64/arm64 + macOS runners.
          # Everything else - byte-order-critical serialization, the scheduler, the
          # failure engine, and every future pure-logic test - now runs by default.
          ctest --test-dir build-s390x --output-on-failure --no-tests=error \
            -E 'oop|program|cgroup|addon|xport|wasm|tui|hang|durable|stress|bench_pool|demo|example_'

  # Prove the C99 core runs "on any hardware": compile under -ffreestanding
  # -fno-builtin against a stub HAL, link NO pthread/dl, and run a task in MANUAL
  # mode with a static memory pool (no libc heap). Backs the portability claim
  # that the HAL (gptps_hal.h) is the only platform seam.
  freestanding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build core with the stub HAL (-ffreestanding, no pthread/dl)
        run: sh freestanding/build.sh ./gptps_freestanding_demo
      - name: Run the MANUAL-mode demo (exit 0 = ran via the HAL seam only)
        run: ./gptps_freestanding_demo
      - name: Assert no thread / dynamic-loader dependency
        # Checked at the SYMBOL level, not with `ldd | grep pthread`. Since glibc
        # 2.34 libpthread and libdl are merged into libc.so.6, so an ldd check
        # passes even for a program that calls pthread_create - it proved nothing
        # and would have kept passing if the HAL seam broke. Undefined symbols are
        # the real evidence: if the core needed threads or dlopen, they would
        # appear here.
        run: |
          if nm -u ./gptps_freestanding_demo | grep -Eq ' (pthread_|dlopen|dlsym|dlclose)'; then
            echo "ERROR: freestanding build references thread / loader symbols:"
            nm -u ./gptps_freestanding_demo | grep -E ' (pthread_|dlopen|dlsym|dlclose)'
            exit 1
          fi
          echo "OK: no pthread / dlopen symbols (still links a hosted libc, by design)"
