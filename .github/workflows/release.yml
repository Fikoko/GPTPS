name: release

# Publishes a GitHub Release when a version tag is pushed.
#
# The artifact is the single-file amalgamation, because that is the form most
# people will actually consume GPTPS in: two files, no build system, no
# dependencies. Cloning an unpinned HEAD was previously the ONLY way to obtain the
# library, which meant no blog post, HN comment, vcpkg portfile or Dockerfile could
# reference a stable, verifiable URL.
#
# The payload is built and RUN here before it is attached - a release artifact that
# was never compiled is a promise, not a deliverable.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build + test at the tag
        # Do not ship an artifact from a tree that does not pass its own suite.
        #
        # --no-tests=error because `ctest` exits 0 when it finds no tests at all,
        # which would turn this gate - the one thing standing between a broken tree
        # and a published artifact - into a no-op that reports success.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Generate the amalgamation (core + every add-on)
        # Add-ons are separate .c/.h pairs, never folded into gptps.c - see the
        # rationale at the top of tools/amalgamate.sh. gptps.c stays byte-identical
        # regardless of this selection, which is what keeps its SHA256 pinnable.
        run: sh tools/amalgamate.sh amalgamation --addons all

      - name: Verify the artifacts compile, run, and are licensed
        run: |
          # The core, built exactly the way the release notes tell people to.
          cc -std=c99 -D_GNU_SOURCE -Wall -Wextra -I amalgamation \
             amalgamation/gptps.c tests/test_engine.c -lpthread -ldl -o amalg_check
          ./amalg_check
          # An ADD-ON artifact, likewise - and running its real test, so a broken
          # amalgamated add-on cannot ship as "it compiled".
          cc -std=c99 -D_GNU_SOURCE -Wall -Wextra -I amalgamation \
             amalgamation/gptps.c amalgamation/gptps_durable_queue.c \
             tests/test_durable.c -lpthread -ldl -o amalg_addon_check
          ./amalg_addon_check
          # The licence loop now covers EVERY generated file, not just the core two.
          # An add-on vendored without the MIT notice is as unfixable after the fact
          # as a core file would be.
          for f in amalgamation/*.c amalgamation/*.h; do
            grep -q 'Permission is hereby granted' "$f" \
              || { echo "ERROR: $f ships with no MIT notice"; exit 1; }
            grep -q 'SPDX-License-Identifier: MIT' "$f" \
              || { echo "ERROR: $f has no SPDX tag"; exit 1; }
          done

      - name: Stage the release payload
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp amalgamation/gptps.c amalgamation/gptps.h LICENSE dist/
          # One asset per add-on. The per-file URL is the requirement: a Dockerfile
          # with no tar, no clone and no build system does `curl -LO .../gptps_pool.c`,
          # which is exactly how the core is already consumed.
          cp amalgamation/gptps_*.c amalgamation/gptps_*.h dist/
          # ...plus a tarball for people who want the set. FIXED name, no version in
          # it: the files: block below is a literal list, so a name containing
          # $VERSION could never be written there - which is why this tarball was
          # built on every release and published on none of them. The tag already
          # carries the version.
          tar -czf "dist/gptps-addons.tar.gz" -C amalgamation \
              $(cd amalgamation && ls gptps_*.c gptps_*.h) -C "$PWD" LICENSE
          # Assert every emitted add-on is actually in the files: block below.
          #
          # The check this replaces compared `ls dist/gptps_*.c` to
          # `amalgamate.sh --list` - but both sides derive from the same cp glob, so
          # it was a tautology that could never fire while the real defect (an add-on
          # missing from files:) sailed past it. Grep the WORKFLOW, which is the thing
          # that can actually be out of date. tools/check_addon_coverage.sh runs the
          # same check on every push, so this is the backstop, not the first line.
          for a in $(sh tools/amalgamate.sh --list); do
            grep -q "dist/gptps_$a\.c" "$GITHUB_WORKSPACE/.github/workflows/release.yml" \
              || { echo "ERROR: gptps_$a.c is not in the files: block; it would not be published"; exit 1; }
          done
          cd dist
          sha256sum * > SHA256SUMS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Extract this version's changelog section
        # Everything between this version's heading and the next one. Falls back to
        # a pointer rather than failing the release if the heading is missing.
        run: |
          VERSION="${{ steps.stage.outputs.version }}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > NOTES.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "## Getting it"
            echo ""
            echo 'Drop the two attached files into your project — no build system, no dependencies:'
            echo ""
            echo '```sh'
            echo "cc -std=c99 myapp.c gptps.c -I. -lpthread -ldl   # Linux"
            echo "cc -std=c99 myapp.c gptps.c -I. -lpthread        # macOS"
            echo '```'
            echo ""
            echo 'Or build from source with CMake: `cmake -S . -B build && cmake --build build`.'
            echo ""
            echo 'Checksums are in `SHA256SUMS`.'
          } >> NOTES.md

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GPTPS ${{ steps.stage.outputs.version }}"
          body_path: NOTES.md
          # Default is false, and the action only warns before publishing anyway -
          # so a `files:` entry that staging never produced would ship a release
          # QUIETLY missing an asset. Every path below is literal, not a glob, so
          # this can only fire on a real staging bug.
          fail_on_unmatched_files: true
          # Literal paths, not globs: a glob that matched nothing would publish a
          # release quietly missing an asset, and fail_on_unmatched_files cannot see
          # a file the list never mentioned. The staging step asserts this list is
          # complete against `amalgamate.sh --list`, so adding an add-on without
          # adding it here fails the release rather than shipping a partial one.
          files: |
            dist/gptps.c
            dist/gptps.h
            dist/LICENSE
            dist/SHA256SUMS
            dist/gptps-addons.tar.gz
            dist/gptps_await.c
            dist/gptps_await.h
            dist/gptps_durable_queue.c
            dist/gptps_durable_queue.h
            dist/gptps_gpu_quota.c
            dist/gptps_gpu_quota.h
            dist/gptps_orch.c
            dist/gptps_orch.h
            dist/gptps_pool.c
            dist/gptps_pool.h
            dist/gptps_tui.c
            dist/gptps_tui.h
            dist/gptps_wasm_exec.c
            dist/gptps_wasm_exec.h
            dist/gptps_xport.c
            dist/gptps_xport.h
